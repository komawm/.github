# Declarative repository settings for the published komawm repositories.
# This file is descriptive: it is not consumed by an automatic API writer.
schema_version = 1
remote_changes_enabled = true

[repositories.koma]
url = "https://github.com/komawm/koma"
description = "Wayland tiling compositor with explicit desktop automation interfaces"
topics = ["wayland", "compositor", "rust", "window-manager", "lua"]
has_issues = true
has_wiki = false
default_branch = "main"
allow_squash_merge = true
delete_branch_on_merge = true
visibility = "public"
release_environment = "release"
release_deployment_policy = "tag:v*.*.*"
release_active_secrets = []
release_planned_secrets = ["COSIGN_PRIVATE_KEY", "COSIGN_PASSWORD", "CARGO_REGISTRY_TOKEN"]

[repositories.organization]
url = "https://github.com/komawm/.github"
description = "Koma organization profile and portable workspace governance"
topics = ["koma", "workspace", "developer-tools"]
has_issues = true
has_wiki = false
default_branch = "main"
allow_squash_merge = true
delete_branch_on_merge = true
visibility = "public"
security_policy = "SECURITY.md"

[repositories.jiku]
url = "https://github.com/komawm/jiku"
description = "Desktop orchestration agent with bundled skills for Koma"
topics = ["wayland", "desktop-automation", "rust", "lua"]
has_issues = true
has_wiki = false
default_branch = "main"
allow_squash_merge = true
delete_branch_on_merge = true
visibility = "public"
release_environment = "release"
release_deployment_policy = "tag:v*.*.*"
release_active_secrets = []
release_planned_secrets = ["COSIGN_PRIVATE_KEY", "COSIGN_PASSWORD", "CARGO_REGISTRY_TOKEN"]

[repositories.koma-types]
url = "https://github.com/komawm/koma-types"
description = "Versioned Koma Lua configuration type definitions"
topics = ["koma", "lua", "types", "luals"]
has_issues = true
has_wiki = false
default_branch = "main"
allow_squash_merge = true
delete_branch_on_merge = true
visibility = "public"
release_environment = "release"
release_deployment_policy = "tag:v*.*.*"
release_active_secrets = []
release_planned_secrets = ["COSIGN_PRIVATE_KEY", "COSIGN_PASSWORD"]

[repositories.koma-docs]
url = "https://github.com/komawm/docs"
description = "Canonical Koma and Jiku architecture, specifications, and user manuals"
topics = ["koma", "wayland", "documentation"]
has_issues = false
has_wiki = false
default_branch = "main"
require_pull_request = false
required_checks = []
require_review = false
coderabbit_required = false
workflows = ["ci", "cd-manual"]
visibility = "public"
manual_cd_environment = "manual-cd"
manual_cd_deployment_policy = "branch:main"
manual_cd_active_secrets = []
manual_cd_planned_secrets = [
  "CLOUDFLARE_ACCOUNT_ID",
  "CLOUDFLARE_API_TOKEN",
  "WEBSITE_DISPATCH_TOKEN",
]

[repositories.packaging]
url = "https://github.com/komawm/packaging"
description = "Koma distribution packaging and guarded release delivery"
topics = ["koma", "packaging", "archlinux", "release"]
has_issues = false
has_wiki = false
default_branch = "main"
require_pull_request = false
required_checks = []
workflows = ["ci", "cd-archlinux", "cd-release", "cd-release-matrix"]
visibility = "public"
release_environment = "release"
release_deployment_policy = "branch:main"
release_publish_default = false
release_active_secrets = ["PRODUCT_RELEASE_TOKEN"]
release_planned_secrets = [
  "CLOUDFLARE_ACCOUNT_ID",
  "CLOUDFLARE_API_TOKEN",
  "GH_PAT",
  "COSIGN_PRIVATE_KEY",
  "COSIGN_PASSWORD",
  "AUR_SSH_PRIVATE_KEY",
  "APT_GPG_PRIVATE_KEY",
  "APT_GPG_PASSPHRASE",
  "APT_REPO_TOKEN",
  "COPR_CONFIG",
  "COPR_API_LOGIN",
  "COPR_API_TOKEN",
  "RPM_GPG_PRIVATE_KEY",
  "RPM_GPG_PASSPHRASE",
  "ABUILD_PRIVATE_KEY",
  "ABUILD_PUBLIC_KEY",
  "CACHIX_AUTH_TOKEN",
  "CACHIX_SIGNING_KEY",
  "HOMEBREW_TAP_TOKEN",
  "FREEBSD_PKG_SIGNING_KEY",
]

[repositories.website]
url = "https://github.com/komawm/website"
homepage = "https://komawm.org"
description = "Public Koma (komawm.org) and Jiku (komawm.org/jiku/) tri-lingual static website"
topics = ["koma", "jiku", "astro", "cloudflare-workers", "documentation"]
has_issues = true
has_wiki = false
default_branch = "main"
allow_squash_merge = true
delete_branch_on_merge = true
workflows = ["ci", "deploy", "codeql", "snapshot-source"]
visibility = "public"
production_environment = "production"
production_deployment_policy = "branch:main or repository_dispatch:manual-published"
production_active_secrets = []
production_planned_secrets = [
  "CLOUDFLARE_ACCOUNT_ID",
  "CLOUDFLARE_API_TOKEN",
]
